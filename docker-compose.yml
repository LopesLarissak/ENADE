name: enade-plataforma
services:
  kerberos:
    build: ./infra/kerberos
    container_name: enade-kerberos
    environment:
      KRB5_KDC_MASTER_PASSWORD: ${KRB5_KDC_MASTER_PASSWORD:?Defina KRB5_KDC_MASTER_PASSWORD no .env}
    volumes:
      - kerberos_db:/var/lib/krb5kdc
      - kerberos_keytabs:/keytabs
      - elasticsearch_keytab:/es-keytab
      - elasticsearch_certs:/certs
    healthcheck:
      test: ["CMD-SHELL", "kadmin.local -r ENADE.LOCAL -q 'getprinc kafka/kafka@ENADE.LOCAL' >/dev/null 2>&1 && test -s /keytabs/api.keytab && test -s /keytabs/worker.keytab && test -s /es-keytab/elasticsearch-http.keytab && test -s /certs/elasticsearch.crt"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    container_name: enade-kafka
    depends_on:
      kerberos: {condition: service_healthy}
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: GSSAPI
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: GSSAPI
      KAFKA_SASL_KERBEROS_SERVICE_NAME: kafka
      KAFKA_LISTENER_NAME_SASL__PLAINTEXT_GSSAPI_SASL_JAAS_CONFIG: com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true doNotPrompt=true keyTab="/etc/security/keytabs/kafka.keytab" principal="kafka/kafka@ENADE.LOCAL";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kerberos_keytabs:/etc/security/keytabs:ro
      - ./infra/kerberos/krb5.conf:/etc/krb5.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    depends_on:
      kerberos: {condition: service_healthy}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/elasticsearch.key
      xpack.security.http.ssl.certificate: certs/elasticsearch.crt
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.security.transport.ssl.key: certs/elasticsearch.key
      xpack.security.transport.ssl.certificate: certs/elasticsearch.crt
      xpack.security.authc.token.enabled: "true"
      xpack.security.authc.realms.kerberos.kerb1.order: "0"
      xpack.security.authc.realms.kerberos.kerb1.keytab.path: keytabs/elasticsearch-http.keytab
      xpack.security.authc.realms.kerberos.kerb1.remove_realm_name: "true"
      xpack.security.authc.realms.file.file1.order: "1"
      ES_JAVA_OPTS: -Xms512m -Xmx512m -Djava.security.krb5.conf=/usr/share/elasticsearch/config/krb5.conf
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - elasticsearch_keytab:/usr/share/elasticsearch/config/keytabs:ro
      - elasticsearch_certs:/usr/share/elasticsearch/config/certs:ro
      - ./infra/kerberos/roles.yml:/usr/share/elasticsearch/config/roles.yml:ro
      - ./infra/kerberos/role_mapping.yml:/usr/share/elasticsearch/config/role_mapping.yml:ro
      - ./infra/kerberos/krb5.conf:/usr/share/elasticsearch/config/krb5.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:9200/); [ \"$$code\" = 401 ] || [ \"$$code\" = 200 ]"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 15

  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: ENADE
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: ${LDAP_PASSWORD:-admin_dev_password_change_me}
      LDAP_TLS: "false"
    ports: ["389:389"]
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./infra/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro

  api:
    build: .
    command: ["/app/scripts/with_kerberos.sh", "uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      KRB5_CONFIG: /etc/krb5.conf
      KRB5_KEYTAB: /etc/security/keytabs/api.keytab
      KRB5_PRINCIPAL: api/api@ENADE.LOCAL
      KRB5CCNAME: FILE:/tmp/krb5cc_api
      ELASTIC_URL: https://elasticsearch:9200
      ELASTIC_CA_CERTS: /etc/elasticsearch/certs/ca.crt
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
    ports: ["8000:8000"]
    volumes:
      - .:/app
      - ./data:/app/data
      - kerberos_keytabs:/etc/security/keytabs:ro
      - elasticsearch_certs:/etc/elasticsearch/certs:ro
      - ./infra/kerberos/krb5.conf:/etc/krb5.conf:ro
    depends_on:
      kerberos: {condition: service_healthy}
      kafka: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      redis: {condition: service_healthy}
      openldap: {condition: service_started}

  worker:
    build: .
    command: ["/app/scripts/with_kerberos.sh", "python", "-m", "app.worker.consumer"]
    env_file: .env
    environment:
      KRB5_CONFIG: /etc/krb5.conf
      KRB5_KEYTAB: /etc/security/keytabs/worker.keytab
      KRB5_PRINCIPAL: worker/worker@ENADE.LOCAL
      KRB5CCNAME: FILE:/tmp/krb5cc_worker
      ELASTIC_URL: https://elasticsearch:9200
      ELASTIC_CA_CERTS: /etc/elasticsearch/certs/ca.crt
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - .:/app
      - ./data:/app/data
      - kerberos_keytabs:/etc/security/keytabs:ro
      - elasticsearch_certs:/etc/elasticsearch/certs:ro
      - ./infra/kerberos/krb5.conf:/etc/krb5.conf:ro
    depends_on:
      kerberos: {condition: service_healthy}
      kafka: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    image: node:20-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: ["./frontend:/web"]
    depends_on: [api]

volumes:
  kafka_data:
  es_data:
  redis_data:
  ldap_data:
  ldap_config:
  kerberos_db:
  kerberos_keytabs:
  elasticsearch_keytab:
  elasticsearch_certs:
