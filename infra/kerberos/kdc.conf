[kdcdefaults]
    kdc_ports = 88
    kdc_tcp_ports = 88

[realms]
    ENADE.LOCAL = {
        database_name = /var/lib/krb5kdc/principal
        key_stash_file = /var/lib/krb5kdc/.k5.ENADE.LOCAL
        acl_file = /etc/krb5kdc/kadm5.acl
        kadmind_port = 749
        max_life = 10h
        max_renewable_life = 7d
        default_principal_flags = +preauth
    }
