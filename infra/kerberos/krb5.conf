[libdefaults]
    default_realm = ENADE.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false
    ticket_lifetime = 10h
    renew_lifetime = 7d
    forwardable = true
    udp_preference_limit = 1

[realms]
    ENADE.LOCAL = {
        kdc = kerberos:88
        admin_server = kerberos:749
    }

[domain_realm]
    .enade.local = ENADE.LOCAL
    enade.local = ENADE.LOCAL
